plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base.archivesName = project.archives_base_name
version = project.mod_version + "+mc" + project.minecraft_version
group = project.maven_group

repositories {
    mavenCentral()

    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.saps.dev/minecraft" }
    maven { url "https://maven.bai.lol/" }
    maven { url "https://maven.architectury.dev/" }
    maven {
        url "https://maven.isxander.dev/releases"
        content {
            includeGroup "dev.isxander"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://jitpack.io"
        content {
            includeGroupByRegex("com\\.github\\..+")
        }
    }
}

var settings = new Object() {
    boolean wthit
    boolean modmenu
    boolean rei
    boolean jade
}
apply from: "config.gradle", to: settings

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    implementation "net.fabricmc:fabric-loader:$loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$fabric_version"

    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"
    compileOnly "dev.architectury:architectury-fabric:$architectury_version"
    implementation "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly "com.terraformersmc:modmenu:$modmenu_version"

    implementation include("dev.isxander:yet-another-config-lib:$yacl_version")
    implementation annotationProcessor(include("com.github.mattidragon:configtoolkit:$configtoolkit_version"))

    // Add generated data to runtime classpath (slightly hacky)
    runtimeOnly files("src/main/generated")

    if (settings.rei) {
        localRuntime "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
        localRuntime "dev.architectury:architectury-fabric:$architectury_version"
    }
    if (settings.modmenu) localRuntime "com.terraformersmc:modmenu:$modmenu_version"

    // WTHIT
    compileOnly "mcp.mobius.waila:wthit-api:$wthit_version"
    if (settings.wthit) {
        localRuntime "mcp.mobius.waila:wthit:$wthit_version"
    }

    compileOnly "maven.modrinth:jade:$jade_version"
    if (settings.jade) {
        localRuntime "maven.modrinth:jade:$jade_version"
    }

    // EMI, megane, TechReborn, Modern Industrialization and Industrial Revolution
    // integrations are deferred: no 26.2-compatible releases exist yet.
    // Their source lives outside the source set and their entrypoints were removed.
    // Compat recipes for those mods are kept: they are identifier-based and
    // guarded by "fabric:mods_loaded" resource conditions, so they simply
    // stay dormant until those mods load.
}

loom {
    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=fabricaeexnihilo"
            //vmArg "-Dfabric-api.datagen.strict-validation"

            ideConfigGenerated = true

            runDir "build/datagen/"
        }
    }

    // Apply datagen at runtime
    mods {
        fabricaeexnihilo {
            sourceSet sourceSets.main
        }
    }
}

// Hack to copy dependency overrides to datagen
tasks.register('copyDatagenOverrides', Copy) {
    from "run/config/fabric_loader_dependencies.json"
    into "build/datagen/config"
}
clean.finalizedBy(tasks.copyDatagenOverrides)
tasks.runDatagen.dependsOn(tasks.copyDatagenOverrides)

// Delete datagen on clean
clean.delete("src/main/generated")


import groovy.json.JsonException
import groovy.json.JsonSlurper
import groovy.json.JsonOutput

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    doLast {
        fileTree(dir: outputs.files.asPath, include: "**/*.json").each { File file ->
            try {
                file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
            } catch (JsonException e) {
                throw new RuntimeException("Failed to minify json for $file", e)
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
    it.options.compilerArgs << "-Xmaxerrs" << "10000"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
    // Copy datagen to jar
    dependsOn tasks.runDatagen
    from("src/main/generated") {
        exclude "README.md"
        exclude ".cache"
    }
}

publishing {
    publications.register("mavenJava", MavenPublication) {
        from components.java
    }
}
