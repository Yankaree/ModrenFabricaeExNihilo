name: Build

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle Caching
        uses: burrunan/gradle-cache-action@v1
        with:
          gradle-distribution-sha-256-sum-warning: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee gradle-output.log

      - name: Dump build log tail to summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Gradle output (tail 600 lines)"
            echo '```'
            tail -n 600 gradle-output.log || echo "no log produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-output.log

      - name: Push log to ci-logs branch
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/ci-logs >/dev/null 2>&1; then
            git fetch origin ci-logs -q
            git checkout -q -B ci-logs origin/ci-logs
          else
            git checkout -q --orphan ci-logs
            git rm -q -rf --cached . || true
          fi
          mkdir -p logs
          cp gradle-output.log "logs/${{ github.run_id }}.log"
          git add -f logs
          git commit -qm "ci log for run ${{ github.run_id }}"
          git push -q origin ci-logs

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
